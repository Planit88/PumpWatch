name: Update station list

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-stations.yml"
      - "scripts/fetch-stations.mjs"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download fuel stations from OpenStreetMap
        run: node scripts/fetch-stations.mjs
      - name: Save the new list
        run: |
          if git diff --quiet -- stations.json; then
            echo "No changes to the station list."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stations.json
          git commit -m "Update station list from OpenStreetMap"
          git push
